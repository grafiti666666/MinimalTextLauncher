name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q MinimalTextLauncher-Fixed.zip
          cd MinimalTextLauncher
          echo "Project extracted successfully"
          ls -la

      - name: Build APK
        working-directory: MinimalTextLauncher
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalTextLauncher-APK
          path: MinimalTextLauncher/app/build/outputs/apk/debug/app-debug.apk
